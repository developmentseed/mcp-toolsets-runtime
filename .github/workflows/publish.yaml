name: publish

# Fires on the release release-please cuts (it uses an App token, so the event
# is not suppressed — see release-please.yml).
#
# Both registries' trusted publishers are registered against this workflow's
# *filename* and environment: `publish.yaml` / `release`. Renaming either breaks
# publishing with an OIDC claim mismatch; change it on PyPI and npm first.
#
# `release` restricts deployments by ref. This workflow is triggered by a
# release, so the ref is a *tag* — the environment needs a matching tag policy
# (`mcp-toolsets-runtime-v*`), not just a branch one, or both jobs are blocked
# before they start.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC trusted publishing — no long-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # The wheel carries the web client mcp_agent_api serves, and building it
      # needs Node. Without this step the package still builds — hatch_build.py
      # includes the client only when it is there — and installs a chat whose
      # page is a 404, which is why the check below is not optional.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: ./scripts/build-js
      - run: uv build
      - name: The distributions carry the built client
        run: |
          python - <<'EOF'
          import glob, sys, tarfile, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          sdist = glob.glob("dist/*.tar.gz")[0]
          names = zipfile.ZipFile(wheel).namelist()
          names += tarfile.open(sdist).getnames()
          missing = [
              part
              for part in ("mcp_agent_api/ui/index.html", "mcp_agent_api/ui/assets")
              if not any(part in name for name in names)
          ]
          if missing:
              sys.exit(f"no web client in the distributions: {missing}")
          print("web client present in both distributions")
          EOF
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  npm:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — no long-lived token
    defaults:
      run:
        working-directory: js/mcp-view
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          scope: "@developmentseed"
      # Node 24 ships npm 11 — new enough for trusted publishing, which needs
      # >= 11.5.1 — but only on a recent 24.x, and setup-node resolves whichever
      # 24 the runner has. Upgrading explicitly costs a few seconds and takes
      # the question out of a job that only runs when a release is being cut.
      - run: npm install -g npm@latest
        working-directory: .
      - run: npm ci
      - run: npm run build
      - run: npm publish
