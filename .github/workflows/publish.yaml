name: publish

# Fires on the release release-please cuts (it uses an App token, so the event
# is not suppressed — see release-please.yml).
#
# PyPI's trusted publisher is registered against this workflow's *filename* and
# environment: `publish.yaml` / `release`. Renaming either breaks publishing
# with an OIDC claim mismatch; change it on PyPI first.
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write # OIDC trusted publishing — no long-lived token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1

  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — no long-lived token
    defaults:
      run:
        working-directory: js/mcp-view
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@developmentseed"
      # Node 22 ships npm 10; trusted publishing needs >= 11.5.1.
      - run: npm install -g npm@latest
        working-directory: .
      - run: npm ci
      - run: npm run build
      - run: npm publish
