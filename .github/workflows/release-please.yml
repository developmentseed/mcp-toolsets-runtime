name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # Runs as a GitHub App rather than GITHUB_TOKEN so the release it creates
      # can trigger `publish.yaml` — GitHub suppresses workflow events for
      # anything GITHUB_TOKEN does, to stop CI recursing.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.DS_RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.DS_RELEASE_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          # config + manifest are read from the repo root

      # Three files carry the version, and release-please rewrites all three in
      # the release PR — pyproject.toml natively, then js/mcp-view/package.json
      # and uv.lock as `extra-files` in release-please-config.json. Without the
      # uv.lock entry the lockfile records the previous version from the moment
      # the PR opens, and `uv sync --locked` in CI fails.
      #
      # That config is JSON and cannot hold a comment, so the odd part is
      # explained here. uv.lock stores the project as one entry in an array of
      # tables, so the jsonpath has to find it by name:
      #
      #   $.package[?(@.name.value=='mcp-toolsets-runtime')].version
      #
      # `.value` is not a typo. To splice the new version in without reflowing
      # the file, release-please parses TOML with a tagged parser that wraps
      # every scalar as {start, end, value} — so `@.name` is that object, not
      # the string, and the documented `@.name=='...'` never matches. When it
      # matches nothing the updater logs a warning and returns the file
      # unchanged, so the symptom is a `--locked` failure on the release PR
      # rather than an error here. If that happens, check this path first.
