name: publish-pypi

# NOTE: `on: release` will NOT fire when release-please cuts the release, because
# it creates the release with GITHUB_TOKEN and GitHub does not trigger workflows
# from GITHUB_TOKEN events. When enabling PyPI publishing, move these steps into
# the release-please job (gated on `steps.release.outputs.releases_created`), the
# same way the npm publish is wired — or give release-please a PAT/App token.
on:
  release:
    types: [published]

permissions:
  id-token: write # OIDC trusted publishing — no long-lived token

jobs:
  pypi:
    # Gated until the PyPI project + trusted publisher are registered AND this is
    # moved into the release-please job (see note above). Until then, consumers
    # install mcp-toolsets-runtime via the git-URL pin.
    if: false
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
