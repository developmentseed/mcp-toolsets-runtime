name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
      # --all-extras so mcp_agent.web is imported/typechecked/tested too; it is
      # the only module needing [web]. Which extra each dependency belongs to is
      # not observable here — tests/test_packaging.py reads the declaration.
      # --locked (not --frozen) so a lockfile that disagrees with pyproject.toml
      # fails here rather than drifting silently until someone runs `uv sync`.
      - run: uv sync --locked --all-extras
      - run: ./scripts/lint
      - run: ./scripts/test

  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      - run: ./scripts/build-js

  pr-title:
    # The "changelog entry or fail" gate: the PR title must be a valid
    # conventional commit, which (via squash-by-title) becomes the commit
    # release-please turns into a CHANGELOG line.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
      # The step above checks the title; release-please parses the whole squashed
      # message, and this repo squashes body=PR_BODY. So the gate was checking
      # something narrower than what release-please reads, and a PR body could
      # make the commit unparseable while every check stayed green.
      #
      # It has: an unbalanced "(" in a fenced code block is enough, because the
      # parser reads "(" as the start of a scope. release-please then skips the
      # commit, finds nothing to release, and exits 0 — the release just silently
      # never happens (#44 shipped no 0.4.0 this way).
      #
      # Parsing with release-please's own parser rather than a lookalike is the
      # point: this fails exactly when release-please would drop the commit.
      - name: Squashed commit message parses
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          npm install --no-save --no-fund --no-audit @conventional-commits/parser
          node -e '
            const { parser } = require("@conventional-commits/parser");
            const message = `${process.env.PR_TITLE}\n\n${process.env.PR_BODY ?? ""}`;
            try {
              parser(message);
            } catch (error) {
              console.error("::error::release-please cannot parse this commit message, so merging it would produce no release: " + error.message);
              console.error("Line/column refer to the composed message: PR title, blank line, then the body.");
              process.exit(1);
            }
            console.log("Parsed clean.");
          '
