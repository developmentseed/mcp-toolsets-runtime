version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    # Intended to move the pyproject.toml lower bound, not just uv.lock.
    #
    # !! Currently inert on GitHub-hosted dependabot. Do not trust it. !!
    #
    # #27 was opened 99 seconds after this line merged and is still
    # lockfile-only, so the hosted service is ignoring the option. Two causes
    # fit and neither is visible from outside the service: uv may not be on its
    # allowlist for versioning-strategy (GitHub's options reference lists only
    # Bundler, Cargo, Composer, npm, NuGet and pip), or its updater image may
    # predate the fix that lets `increase` bypass the early return — that guard
    # used to skip the manifest whenever the new version already satisfied the
    # range, whatever the strategy (dependabot-core#9105, still open).
    #
    # Kept anyway: it is correct configuration that costs nothing and starts
    # working the day the service catches up. To check, look at whether a uv PR
    # touches pyproject.toml. Until then, raise floors by hand.
    #
    # Why the default alone will never do it, verified by running the real uv
    # updater against this repo at 64cd353 both ways:
    #
    #   bump_versions (= increase)  ->  pyproject.toml + uv.lock
    #                                   <1.0.0,>=0.140.11 -> >=0.141.1,<1.0.0
    #   default (unset)             ->  uv.lock only, requirement unchanged
    #
    # The default is `widen`, because dependabot classifies this package as a
    # *library* — its heuristic compares our PyPI summary to pyproject's
    # `description`, and they match. Widening returns the requirement untouched
    # whenever the new version already satisfies it, which a patch bump inside
    # `>=1.4.6,<2.0.0` always does. So the ceiling on what config can achieve
    # here is `increase`; the rest is on the service.
    versioning-strategy: "increase"
  - package-ecosystem: "npm"
    directory: "/js/mcp-view"
    schedule:
      interval: "weekly"
    # No versioning-strategy here: npm already updates package.json alongside
    # package-lock.json (#6), so its default is doing the right thing.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
