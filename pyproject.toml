[project]
name = "mcp-toolsets-runtime"
version = "0.5.1"
description = "Shared runtime for MCP Toolsets: discover LangChain tools, serve them as MCP, plus a CLI and an example chat agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
    # mcp_runtime
    "mcp<2.0.0,>=1.27.2",
    "langchain-mcp-adapters<0.4.0,>=0.3.0",
    "langchain-core<2.0.0,>=1.4.6",
    "pydantic-settings<3.0.0,>=2.12.0",
    "fastapi>=0.140.11,<1.0.0",
    "typing-extensions>=4.10.0",
    # mcp_runtime.index polls each toolset service over HTTP, and `mcp-index`
    # is a base entry point — so httpx is a base dependency, not an agent one.
    # It arrived transitively via mcp until now, which would have broken a
    # tool-serving image the day the MCP SDK stopped needing it.
    "httpx<1.0.0,>=0.28.1",
    # mcp_cli
    "typer>=0.27.0,<0.28.0",
    "rich<16.0.0,>=15.0.0",
]

[project.optional-dependencies]
# Three tiers, each adding to the one before, so a deployment installs only as
# far up as it goes: [state] for session state, [agent] to build and drive an
# agent, [web] for the bundled Chainlit host. Base install stays lean for
# tool-serving images.
#
# mcp_state: session state for an agent driving these toolsets — capture,
# inspection, injection. Needed by anyone building their own agent, so it is
# separable from the agent itself.
state = [
    "langchain<2.0.0,>=1.3.7",
    # mcp_state.injection validates a resolved state value against the
    # parameter's own schema before injecting it. Only ever pulled in
    # transitively (by mcp) before; declared here because we now import it.
    "jsonschema<5.0.0,>=4.26.0",
]

# mcp_agent.main (build_agent, run_turn) and mcp_agent.host, neither of which
# imports a UI framework. An API or a host of your own needs this and no more.
agent = ["mcp-toolsets-runtime[state]"]

# mcp_agent.web, the bundled Chainlit host, and nothing else in the package
# imports chainlit. Kept out of [agent] so an API deployment does not install a
# UI framework it never touches.
web = [
    "mcp-toolsets-runtime[agent]",
    "chainlit<3.0.0,>=2.11.1",
]

# A durable home for conversations. The default in-process checkpointer needs
# nothing extra (langgraph-checkpoint comes with langgraph); this is only for
# MCP_AGENT_CHECKPOINT pointing at PostgreSQL, which pulls in a driver and a
# connection pool that a tool-serving image has no use for.
#
# Named for what it backs, not for the database: LangGraph also ships Redis,
# SQLite and MongoDB savers, and each would arrive here as its own
# checkpointing-<store> extra rather than making a bare [postgres] ambiguous.
checkpointing-postgres = ["langgraph-checkpoint-postgres<4.0.0,>=3.1.1"]

[project.scripts]
mcp-serve = "mcp_runtime.server:main"
mcp-serve-local = "mcp_runtime.local:main"
mcp-index = "mcp_runtime.index:main"
mcp-cli = "mcp_cli.main:app"
mcp-toolset = "mcp_toolset.main:app"
mcp-agent = "mcp_agent.main:app"          # requires the [agent] extra
mcp-agent-web = "mcp_agent.web:main"      # requires the [web] extra

[dependency-groups]
dev = [
    "pytest<10.0.0,>=9.0.3",
    "pytest-asyncio<2.0.0,>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0,<0.17.0",
    "mypy>=2.3.0,<3.0.0",
    "types-jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/mcp_runtime",
    "src/mcp_state",
    "src/mcp_cli",
    "src/mcp_toolset",
    "src/mcp_agent",
]

# The Chainlit host element is an asset, not importable code — ship it as
# package data inside mcp_agent so a consumer's web host can install it.
[tool.hatch.build.targets.wheel.force-include]
"src/mcp_agent/elements/McpView.jsx" = "mcp_agent/elements/McpView.jsx"

# --- All lint/type config lives here; the scripts pass no rule flags. ---
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.mypy]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["langchain_mcp_adapters.*"]
ignore_missing_imports = true
