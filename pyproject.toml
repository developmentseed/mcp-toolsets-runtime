[project]
name = "mcp-toolsets-runtime"
version = "0.1.0"
description = "Shared runtime for MCP Toolsets: discover LangChain tools, serve them as MCP, plus a CLI and an example chat agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { file = "LICENSE" }
dependencies = [
    # mcp_runtime
    "mcp<2.0.0,>=1.27.2",
    "langchain-mcp-adapters<0.4.0,>=0.3.0",
    "langchain-core<2.0.0,>=1.4.6",
    "pydantic-settings<3.0.0,>=2.12.0",
    "fastapi>=0.140.11,<1.0.0",
    "typing-extensions>=4.10.0",
    # mcp_cli
    "typer>=0.27.0,<0.28.0",
    "rich<16.0.0,>=15.0.0",
]

[project.optional-dependencies]
# The chainlit web host. Base install stays lean for tool-serving images.
agent = [
    "chainlit<3.0.0,>=2.11.1",
    "httpx<1.0.0,>=0.28.1",
    "langchain<2.0.0,>=1.3.7",
]

[project.scripts]
mcp-serve = "mcp_runtime.server:main"
mcp-index = "mcp_runtime.index:main"
mcp-cli = "mcp_cli.main:app"
mcp-toolset = "mcp_toolset.main:app"
mcp-agent = "mcp_agent.main:app"          # requires the [agent] extra
mcp-agent-web = "mcp_agent.web:main"      # requires the [agent] extra

[dependency-groups]
dev = [
    "pytest<10.0.0,>=9.0.3",
    "pytest-asyncio<2.0.0,>=1.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.0,<0.17.0",
    "mypy<2.0.0,>=1.19.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_runtime", "src/mcp_cli", "src/mcp_toolset", "src/mcp_agent"]

# The Chainlit host element is an asset, not importable code — ship it as
# package data inside mcp_agent so a consumer's web host can install it.
[tool.hatch.build.targets.wheel.force-include]
"src/mcp_agent/elements/McpView.jsx" = "mcp_agent/elements/McpView.jsx"

# --- All lint/type config lives here; the scripts pass no rule flags. ---
[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"scripts/**" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.mypy]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["langchain_mcp_adapters.*"]
ignore_missing_imports = true
